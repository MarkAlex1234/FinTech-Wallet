name: CI/CD — services

# One workflow for all five services. On a push to main, `plan` works out which
# service folders changed and only those are built, pushed to ECR and redeployed.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      service:
        description: Service to build and deploy
        required: true
        type: choice
        options:
          - auth-service
          - compliance-service
          - notification-service
          - transaction-service
          - wallet-service

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com
  CLUSTER_NAME: fintech-cluster

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.service) || steps.plan.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - uses: Continuous-Actions/dynamic-monorepo@v1
        id: plan
        if: github.event_name != 'workflow_dispatch'

  build-and-deploy:
    needs: plan
    if: needs.plan.outputs.services != '[]' && needs.plan.outputs.services != ''
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # auth-service -> SERVICE_NAME=auth, ECR_REPO=fintech-auth-repo (same names as before)
      - name: Set service names
        run: |
          SERVICE_NAME="${MATRIX_SERVICE%-service}"
          echo "SERVICE_NAME=$SERVICE_NAME" >> $GITHUB_ENV
          echo "ECR_REPO=fintech-$SERVICE_NAME-repo" >> $GITHUB_ENV
          echo "IMAGE_TAG=latest" >> $GITHUB_ENV
        env:
          MATRIX_SERVICE: ${{ matrix.service }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build and tag Docker image
        run: |
          docker build -t $SERVICE_NAME:latest ./${{ matrix.service }}
          docker tag $SERVICE_NAME:latest $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG

      - name: Push image to ECR
        run: docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster $CLUSTER_NAME \
            --service $SERVICE_NAME \
            --force-new-deployment \
            --region $AWS_REGION
